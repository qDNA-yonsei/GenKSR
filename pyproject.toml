[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genksr"
version = "3.0.0"
description = "Generative Krylov subspace models for quantum eigensolver simulations"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torch-geometric>=2.3",
    "numpy",
    "scipy",
    "matplotlib",
    "tqdm",
    "pyyaml",
    "tensorboard",
]

[project.optional-dependencies]
# Quantum data generation + SKQD/KQD evaluation (needed for Experiments 4.1 and 4.2).
quantum = [
    "pennylane",
    "pennylane-lightning",
    "qiskit>=1.0",
    "qiskit-aer",
    "qiskit-ibm-runtime",
    "qiskit-addon-sqd",
]
# Mamba backbone — requires a CUDA GPU.
# IMPORTANT: torch must be built for the SAME CUDA version as the system nvcc, and mamba-ssm
# must be SOURCE-BUILT against that torch (prebuilt wheels often have an ABI mismatch). On a
# Blackwell (sm_120) box with nvcc 12.8 the working combo is torch==2.9.x+cu128 + a source build:
#   uv pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cu128
#   CUDA_HOME=/usr/local/cuda TORCH_CUDA_ARCH_LIST=12.0 MAMBA_FORCE_BUILD=TRUE \
#     uv pip install --no-build-isolation --no-binary mamba-ssm mamba-ssm
mamba = [
    "mamba-ssm",
    "transformers<5",   # mamba-ssm 2.2.x imports symbols removed in transformers 5.x
]
# ViT-NQS variational baseline (Table 2 / Figure 9).
vit = [
    "netket",
    "flax",
    "optax",
    "jax",
]

[tool.setuptools.packages.find]
include = ["genksr*"]
