# Experiment 4.2 — 2D J1-J2 Heisenberg SKQD, Mamba backbone (Figure 3 / Table 2)
# Same data/protocol as skqd_2d_transformer.yaml; only the sequence backbone differs.
# NOTE: the Mamba decoder requires the `mamba-ssm` package + a CUDA GPU.

decoder:
  type: mamba
  n_layers: 4
  d_model: 128
  d_state: 16
  d_conv: 4
  expand: 2

encoder:
  arch: gcn_proj_3_16
  gcn_layers: 3
  gcn_dim: 16

data:
  task: sqkd
  lattice: 2d
  n_qubit: 16
  krylov_dim: 15
  train_samples: 1000
  data_root: ./data/heisenberg_SQKD_2d/
  delta: 1.0
  h_z: 0.0
