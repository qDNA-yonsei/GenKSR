experiment_name: pauli_target_trained_staggered_xxz_n8_v1

# Explicit in-family oracle: the same operator template appears in a disjoint
# source_train split and in the frozen target_test split.
source_families: [staggered_field_xxz]
target_family: staggered_field_xxz
allow_target_template_in_source: true

data:
  n_qubit: 8
  depth: 8
  train_shots_per_condition: 500
  # Matches the zero-shot experiment's total 192 training Hamiltonians and
  # 192 * 8 * 500 = 768,000 training bitstrings.
  source_train_per_family: 192
  source_holdout_per_family: 64
  target_test_hamiltonians: 64
  coefficient_range: [0.5, 1.5]
  # Keeping the same master seed makes target_test exactly identical to the
  # frozen cross-family test, while split-specific seeds keep training disjoint.
  master_seed: 20260802

model:
  d_model: 128
  decoder_layers: 4
  decoder_heads: 4
  encoder_layers: 2
  encoder_heads: 4
  symbol_dim: 16
  dropout: 0.1
  encoder_mode: coefficient_sum

training:
  epochs: 100
  batch_size: 4096
  lr: 0.001
  final_lr: 0.0000001
  warmup_fraction: 0.05
  weight_decay: 0.0
  gradient_clip: null
  checkpoint_every: 5
  data_loader_workers: 0

evaluation:
  enumeration_batch_size: 512
  sample_budgets: [50, 100, 250]
  sampling_repeats: 20

smoke:
  data:
    n_qubit: 6
    depth: 3
    train_shots_per_condition: 100
    source_train_per_family: 4
    source_holdout_per_family: 2
    target_test_hamiltonians: 4
  training:
    epochs: 2
    batch_size: 128
    checkpoint_every: 1
  evaluation:
    enumeration_batch_size: 128
    sample_budgets: [20]
    sampling_repeats: 2
